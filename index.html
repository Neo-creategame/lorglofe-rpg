<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ダンジョン試作</title>
  <style>
    :root {
      --bg: #f2f3f6;
      --fg: #1d2230;
      --sub: #596072;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1015;
        --fg: #e8eaf0;
        --sub: #a0a7b8;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e1015;
      --fg: #e8eaf0;
      --sub: #a0a7b8;
      color-scheme: dark;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.7;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      font-size: 1.15rem;
      margin: 0 0 12px;
    }
    #game {
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
    }
    .hint {
      color: var(--sub);
      font-size: .9rem;
      margin: 12px 0 0;
    }
  </style>
</head>
<body>
<main>
  <h1>ダンジョン試作</h1>
  <div id="game"></div>
  <p class="hint">
    移動: WASD または 矢印キー / 攻撃: クリックまたはスペース / スキル: E / バックパック: I / 回避: Shift / 小回復: Q / 全回復: R / 街の施設利用・移動: F / ポーズ・階層選択: Tab
  </p>
</main>

<!-- Phaserライブラリの読み込み -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/4.2.0/phaser.min.js"></script>

<!-- ES Modulesとしてエントリーポイント（src/main.js）を読み込む -->
<script type="module" src="./src/main.js"></script>
</body>
</html>
